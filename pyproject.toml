[project]
name = "taccom"
version = "0.1.0"
description = "Tactical combat copilot for Elite Dangerous"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taccom = "taccom.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taccom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
