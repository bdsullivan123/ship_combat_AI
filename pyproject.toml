[project]
name = "taccom"
version = "0.2.0"
description = "Tactical combat copilot for Elite Dangerous"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    # Neural voice
    "kokoro-onnx>=0.4.7",
    "sounddevice>=0.5",
    # Screen reading
    "dxcam>=0.3; sys_platform == 'win32'",
    "mss>=10",
    "opencv-python>=4.10",
    "rapidocr>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taccom = "taccom.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taccom"]

[tool.setuptools.package-data]
taccom = ["layouts/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
